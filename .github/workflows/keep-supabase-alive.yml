name: Keep Supabase Alive

# Runs every 5 days to prevent Supabase free-tier auto-pause (pauses after 7 days of inactivity)
on:
  schedule:
    - cron: '0 6 */5 * *'   # Every 5 days at 06:00 UTC
  workflow_dispatch:         # Allow manual trigger from GitHub Actions UI

env:
  SUPABASE_URL: "https://jdgitfslhkllqznwycrg.supabase.co"
  SUPABASE_ANON_KEY: "sb_publishable_O2fCotryD1GtN7Vvr49ZgA_PhgiGygX"

jobs:
  ping-supabase:
    name: Ping Supabase DB
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Supabase visitors table
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${SUPABASE_URL}/rest/v1/visitors?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Supabase ping status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Ping failed with status $HTTP_STATUS"
            exit 1
          else
            echo "Supabase is alive and responding!"
          fi
